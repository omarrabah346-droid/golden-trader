<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الباشا · توصيات وأكاديمية التداول</title>
<meta name="description" content="تعلّم التحليل الفني والكلاسيكي والموجي والزمني والرقمي ويا كوتش عمر الباشا. أول درس بكل دورة مجاني.">
<meta property="og:title" content="الباشا · توصيات الذهب والفوركس وأكاديمية التداول">
<meta property="og:description" content="دورات التحليل الفني والكلاسيكي والموجي والزمني والرقمي، ودروس زوم مباشرة. أول درس مجاني.">
<meta property="og:image" content="https://omarrabah346-droid.github.io/golden-trader/coach.jpg">
<meta property="og:url" content="https://omarrabah346-droid.github.io/golden-trader/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#08080a;--panel:#121214;--panel-2:#1a1a1d;--line:#2c2717;--line-2:#222226;
  --fg:#f2f2f3;--muted:#9a9aa3;--accent:#D4AF37;--accent-2:#f5d76e;--accent-ink:#0b0903;--accent-bg:rgba(212,175,55,.12);
  --buy:#34c98e;--sell:#f0606f;--buy-bg:rgba(52,201,142,.13);--sell-bg:rgba(240,96,111,.13);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.75;margin:0}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
.num{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:#4a3f1c}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold:hover{background:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--panel-2);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.gold{background:var(--accent-bg);color:var(--accent)}.chip.up{background:var(--buy-bg);color:var(--buy)}.chip.down{background:var(--sell-bg);color:var(--sell)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(8,8,10,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
.brand b{font-family:var(--f-display);font-size:20px;color:var(--accent)}
.brand span{display:block;font-family:var(--f-num);font-size:10px;letter-spacing:.24em;color:var(--muted);margin-top:-4px}
.nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px;font-weight:500}
.nav a:hover,.nav a[aria-current=page]{color:var(--fg);background:var(--panel-2)}
.who{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel-2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--accent);flex:none}

/* hero */
.hero{padding:44px 0 28px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:36px;align-items:center}
.kicker{display:inline-flex;gap:8px;align-items:center;color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--accent-bg)}
.hero h1{font-size:clamp(30px,4.6vw,50px);margin:16px 0 10px;font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:17px;color:#cfcfd6;max-width:56ch;margin:0 0 18px}
.dips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.dips .chip{font-size:13px;padding:4px 12px;border:1px solid var(--line)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.coach{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/5;background:#111;max-height:560px;justify-self:center;width:100%;max-width:420px}
.coach img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.coach .tag{position:absolute;inset:auto 0 0 0;padding:60px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.coach .tag b{font-family:var(--f-display);font-size:22px;color:var(--accent)}
.coach .tag span{display:block;color:#ddd;font-size:13.5px}
.coach .since{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.72);border:1px solid var(--accent);color:var(--accent);border-radius:12px;padding:6px 12px;text-align:center;line-height:1.2}
.coach .since b{display:block;font-family:var(--f-num);font-size:20px}
.coach .since small{font-size:11px;color:#ddd}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:30px}
.stats div{border:1px solid var(--line-2);border-radius:14px;padding:14px;background:var(--panel)}
.stats b{display:block;font-family:var(--f-display);font-size:24px;color:var(--accent)}
.stats span{font-size:13px;color:var(--muted)}

section.blk{padding:30px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{font-size:25px}
.sh p{margin:4px 0 0;color:var(--muted)}

/* courses */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.course{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;overflow:hidden;min-width:0}
.course:hover{border-color:#4a3f1c}
.course .ic{font-size:30px;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent-bg);border:1px solid var(--line)}
.course h3{font-size:19px}
.course p{margin:0;color:var(--muted);font-size:14px;flex:1}
.course .meta{display:flex;gap:6px;flex-wrap:wrap}
.course .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.price{font-family:var(--f-num);font-size:22px;font-weight:600;color:var(--accent);direction:ltr}
.bar{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8c6d1a,var(--accent-2))}
.owned{position:absolute;top:14px;left:14px}

.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.offer{border-radius:18px;padding:22px;border:1px solid var(--line);background:linear-gradient(160deg,#1b170a,#111113 60%);display:flex;flex-direction:column;gap:10px}
.offer.best{border-color:var(--accent);box-shadow:0 0 0 1px rgba(212,175,55,.25),0 20px 50px -30px rgba(212,175,55,.5)}
.offer h3{font-size:20px}
.offer ul{margin:0;padding:0 18px 0 0;color:#d5d5dc}
.offer li{margin:3px 0}
.offer .price{font-size:30px}
.offer .price small{font-size:14px;color:var(--muted)}

/* sessions */
.sess{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.date{width:64px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 0;background:var(--panel-2);line-height:1.2}
.date b{display:block;font-family:var(--f-num);font-size:22px;color:var(--accent)}
.date span{font-size:12px;color:var(--muted)}
.srow h3{font-size:16px}
.srow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cd{color:var(--accent-2);font-size:13px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:14px}

/* course page */
.crumb{display:flex;gap:6px;color:var(--muted);font-size:13.5px;margin:22px 0 10px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--accent)}
.chead{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.lessons{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);text-decoration:none;color:var(--fg)}
.lrow:hover{border-color:#4a3f1c}
.lrow .n{width:34px;height:34px;border-radius:10px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-family:var(--f-num);color:var(--muted)}
.lrow.done .n{background:var(--buy-bg);color:var(--buy)}
.lrow.free .n{background:var(--accent-bg);color:var(--accent)}
.lrow.lock{opacity:.78}
.lrow b{font-weight:600;display:block}
.lrow small{color:var(--muted)}
.buybox{position:sticky;top:80px;display:grid;gap:12px}

/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;margin-bottom:30px}
.content{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,34px)}
.content h1{font-size:clamp(23px,3vw,30px);margin-bottom:6px}
.content h3{font-size:19px;color:var(--accent);margin:26px 0 8px}
.content p{margin:0 0 12px;color:#dcdce2}
.content ul,.content ol{padding:0 22px 0 0;margin:0 0 14px;color:#dcdce2}
.content li{margin:5px 0}
.content b{color:#fff}
.content .tw{overflow-x:auto;margin:14px 0}
.content table{border-collapse:collapse;width:100%;min-width:420px;font-size:14px}
.content th{background:var(--panel-2);color:var(--accent);text-align:right;padding:9px 12px;border:1px solid var(--line-2)}
.content td{padding:9px 12px;border:1px solid var(--line-2);vertical-align:top}
figure.dg{margin:18px 0;background:#0c0c0e;border:1px solid var(--line-2);border-radius:14px;padding:12px}
figure.dg svg{width:100%;height:auto;display:block}
figure.dg figcaption{text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.tip,.warn,.ex,.key,.fomo,.secret,.road{border-radius:14px;padding:14px 16px;margin:16px 0;border:1px solid}
.tip{background:var(--accent-bg);border-color:#5a4a16}.tip b,.secret b,.fomo b,.road b{color:var(--accent)}
.warn{background:var(--sell-bg);border-color:rgba(240,96,111,.35)}.warn b{color:var(--sell)}
.ex{background:#101622;border-color:#23324d}.ex b{color:#8fb3ff}
.key{background:var(--buy-bg);border-color:rgba(52,201,142,.3)}.key b{color:var(--buy)}
.fomo{background:linear-gradient(135deg,#2a1d06,#141210);border-color:var(--accent)}.fomo b{font-size:16.5px}
.secret{background:#15120a;border:1px dashed var(--accent)}
.road ol{list-style:none;padding:0;margin:8px 0 0}.road li{padding:7px 0;border-top:1px solid var(--line-2);color:#cfcfd6}.road li span{margin-left:6px}
.tip p,.warn p,.ex p,.fomo p,.secret p{margin:6px 0 0}
.key ul{margin:6px 0 0}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

.quiz{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.quiz h3{margin-top:0}
.qq{margin:16px 0}
.qq p{font-weight:600;color:#fff;margin-bottom:8px}
.opt{display:block;width:100%;text-align:right;border:1px solid var(--line-2);background:var(--panel-2);border-radius:10px;padding:10px 13px;margin:6px 0;font-size:14.5px}
.opt:hover{border-color:#4a3f1c}
.opt.ok{border-color:var(--buy);background:var(--buy-bg)}.opt.bad{border-color:var(--sell);background:var(--sell-bg)}
.why{font-size:13.5px;color:var(--muted);margin-top:4px}
.score{padding:12px 14px;border-radius:12px;background:var(--accent-bg);border:1px solid var(--line);margin-top:10px}

.paywall{text-align:center;padding:34px 22px;background:linear-gradient(170deg,#1d1808,#111113 55%);border:1px solid var(--accent);border-radius:18px}
.paywall .lockic{font-size:44px}
.paywall h2{font-size:24px;margin:8px 0}
.paywall p{color:#d0d0d6;max-width:52ch;margin:0 auto 16px}
.paywall .cta{justify-content:center}
.blur{filter:blur(6px);user-select:none;pointer-events:none;opacity:.5;max-height:240px;overflow:hidden;margin-top:18px}
.side{display:grid;gap:12px;position:sticky;top:80px}
.mini{display:flex;gap:12px;align-items:center}
.mini img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.mini b{display:block;color:var(--accent);font-family:var(--f-display)}

/* forms & dialog */
dialog{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dlg{padding:22px;display:grid;gap:12px;overflow:auto}
.dlg h2{font-size:21px}
.fm{display:grid;gap:10px}
.fm label{display:grid;gap:5px;font-size:13.5px;color:var(--muted)}
input,textarea,select{font:inherit;font-size:14.5px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
.ltr{direction:ltr;text-align:left}
.payinfo{white-space:pre-line;background:var(--accent-bg);border:1px solid #5a4a16;border-radius:12px;padding:12px 14px;color:#f0e6c4}
.msg{min-height:1em;margin:0;font-size:13.5px}.msg.ok{color:var(--buy)}.msg.err{color:var(--sell)}
.sum{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;background:var(--panel-2)}

/* orders & admin */
.tbl{overflow-x:auto;border:1px solid var(--line-2);border-radius:14px}
.tbl table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--panel-2);color:var(--muted);font-weight:500;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:5px 14px;font-size:13.5px;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--accent-bg);color:var(--accent);border-color:#5a4a16}
.atiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.atiles div{border:1px solid var(--line-2);border-radius:12px;padding:12px;background:var(--panel)}
.atiles b{display:block;font-family:var(--f-num);font-size:22px;color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcell{display:flex;gap:8px;align-items:center}
.mcell span{display:block;color:var(--muted);font-size:12px}
.acts2{display:grid;gap:6px;min-width:220px}

.steps{display:grid;gap:8px;max-width:440px;margin:0 auto 18px;padding:0 22px 0 0;text-align:right;color:#dcdce2}
.howto{border-radius:14px;padding:14px 16px;margin:16px 0;border:1px solid #23324d;background:#0f1520}.howto b{color:#8fb3ff}.howto ol{margin:8px 0 0}
.check{border-radius:14px;padding:14px 16px;margin:16px 0;border:1px solid rgba(52,201,142,.3);background:rgba(52,201,142,.07)}.check b{color:var(--buy)}.check ul{margin:8px 0 0}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.tool h3{font-size:18px;margin-bottom:4px}.tool .fm{margin-top:10px}
.res{display:grid;gap:6px;margin-top:12px}
.res div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line-2);font-size:14px}
.res b{font-family:var(--f-num);color:var(--accent)}
.fibsvg{width:100%;height:auto;display:block;margin-top:12px;background:#0c0c0e;border:1px solid var(--line-2);border-radius:12px}
.phead{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;padding:34px 0 18px;border-bottom:1px solid var(--line-2);margin-bottom:18px}
.phead h1{font-size:clamp(26px,3.6vw,38px)}
.phead p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,#18150b,#111113 60%);text-decoration:none;color:var(--fg);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile .ti{font-size:30px}
.tile b{font-family:var(--f-display);font-size:18px}
.tile span{color:var(--muted);font-size:14px;flex:1}
.tile i{font-style:normal;color:var(--accent);font-weight:600;font-size:14px}
footer{border-top:1px solid var(--line-2);margin-top:30px;padding:26px 0 40px;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--accent);color:var(--fg);padding:10px 16px;border-radius:12px;z-index:50;font-size:14px;max-width:calc(100vw - 32px)}

@media (max-width:900px){
  .hero .wrap,.chead,.lesson{grid-template-columns:minmax(0,1fr)}
  .coach{max-width:360px;order:-1}
  .buybox,.side{position:static}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .srow{grid-template-columns:auto minmax(0,1fr)}
  .srow .acts{grid-column:1/-1;justify-content:flex-start}
  .two{grid-template-columns:1fr}
  .nav a{padding:5px 7px;font-size:13px}
  .top .wrap{gap:6px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#"><span aria-hidden="true" style="font-size:24px">👑</span><div><b>الباشا</b><span>AL BASHA · ACADEMY</span></div></a>
    <nav class="nav" aria-label="الأقسام">
      <a href="#" data-nav="home">الرئيسية</a>
      <a href="#courses" data-nav="courses">الدورات</a>
      <a href="#live" data-nav="live">دروس الزوم</a>
      <a href="#plans" data-nav="plans">الاشتراكات</a>
      <a href="#tools" data-nav="tools">الأدوات</a>
      <a href="#coach" data-nav="coach">الكوتش</a>
      <a href="#join" data-nav="join">شلون تنضم</a>
      <a href="#orders" data-nav="orders" id="navOrders" hidden>طلباتي</a>

    const R=H-L,d=dp(H),ret=[0,.236,.382,.5,.618,.786,1],ext=[1.272,1.618,2.618];
    const rp=r=>up?H-R*r:L+R*r, ep=r=>up?L+R*r:H-R*r;
    const COL={0:"#9aa0a6",.236:"#f0606f",.382:"#f59e0b",.5:"#34c98e",.618:"#14b8a6",.786:"#3b82f6",1:"#9aa0a6",1.272:"#a855f7",1.618:"#d4af37",2.618:"#ec4899"};
    const all=[...ret.map(r=>[r,rp(r),"ret"]),...ext.map(r=>[r,ep(r),"ext"])],ps=all.map(a=>a[1]),mn=Math.min(...ps),mx=Math.max(...ps);
    const Y=p=>20+(mx-p)/(mx-mn)*300, X0=40,X1=560;
    let g=`<rect x="${X0}" y="${Y(Math.max(rp(.5),rp(.618)))}" width="${X1-X0}" height="${Math.abs(Y(rp(.5))-Y(rp(.618)))}" fill="#d4af37" fill-opacity=".18"/>`;
    all.forEach(([r,p,k])=>{const c=COL[r];g+=`<line x1="${X0}" x2="${X1}" y1="${Y(p)}" y2="${Y(p)}" stroke="${c}" stroke-width="1.4" ${k==="ext"?'stroke-dasharray="6 4"':""}/><text x="${X1+6}" y="${Y(p)+4}" fill="${c}" font-size="12" font-weight="700" direction="ltr">${(r*100).toFixed(1).replace(/\.0$/,"")}%  ${p.toFixed(d)}</text>`});
    const a=up?[X0+20,Y(L)]:[X0+20,Y(H)],b=up?[X0+200,Y(H)]:[X0+200,Y(L)];
    g+=`<polyline points="${a[0]},${a[1]} ${b[0]},${b[1]} ${X0+320},${Y(rp(.618))} ${X0+500},${Y(ep(1.618))}" fill="none" stroke="#e9e9ee" stroke-width="2" stroke-dasharray="5 4"/>`;
    g+=`<text x="${X0+330}" y="${Y(rp(.618))+(up?22:-10)}" fill="#d4af37" font-size="12.5" font-weight="700" direction="rtl" text-anchor="middle">المنطقة الذهبية</text>`;
    $("fOut").innerHTML=`<svg class="fibsvg" viewBox="0 0 700 340" font-family="IBM Plex Sans Arabic,Tahoma,sans-serif">${g}</svg>
     <div class="res"><div><span>🟡 المنطقة الذهبية (50%–61.8%): ${up?"منطقة شراء":"منطقة بيع"}</span><b>${rp(.618).toFixed(d)} – ${rp(.5).toFixed(d)}</b></div>
     <div><span>الوقف المقترح (خلف 78.6%)</span><b>${rp(.786+(.05)).toFixed(d)}</b></div>
     <div><span>🎯 الهدف 1: ${up?"القمة":"القاع"} السابق</span><b>${(up?H:L).toFixed(d)}</b></div>
     <div><span>🎯 الهدف 2: امتداد 161.8%</span><b>${ep(1.618).toFixed(d)}</b></div>
     <div><span>🎯 الهدف 3: امتداد 261.8%</span><b>${ep(2.618).toFixed(d)}</b></div></div>`}
  function lotCalc(){const B=v("lB"),R=v("lR"),E=v("lE"),SL=v("lSL"),t=$("lS").value,dist=Math.abs(E-SL);const risk=B*R/100;
    if(!(dist>0&&B>0&&R>0)){$("lOut").innerHTML='<div><span>اكتب أرقام صحيحة</span></div>';return}
    let perLot,unit;
    if(t==="gold"){perLot=dist*100;unit=`${dist.toFixed(2)}$ (${Math.round(dist*10)} نقطة)`}
    else if(t==="fx"){perLot=dist*100000;unit=`${Math.round(dist*10000)} نقطة`}
    else if(t==="jpy"){perLot=dist*100000/E;unit=`${Math.round(dist*100)} نقطة`}
    else{perLot=dist;unit=`${dist.toFixed(0)}$`}
    const lot=Math.floor(risk/perLot*100)/100;
    $("lOut").innerHTML=`<div><span>المبلغ اللي تخاطر بيه</span><b>${risk.toFixed(2)}$</b></div><div><span>مسافة الوقف</span><b>${unit}</b></div>
     <div style="border-color:var(--accent)"><span>حجم اللوت المناسب</span><b style="font-size:18px">${lot>0?lot.toFixed(2):"أقل من 0.01"}</b></div>
     ${lot<0.01?'<div><span class="down">رأس المال صغير على هذا الوقف. قرّب الوقف أو زِد المخاطرة شوية.</span></div>':`<div><span>الخسارة الفعلية إذا ضرب الوقف</span><b>${(lot*perLot).toFixed(2)}$</b></div>`}`}
  function rrCalc(){const E=v("rE"),SL=v("rS"),t1=v("r1"),t2=v("r2"),risk=Math.abs(E-SL);if(!(risk>0)){$("rOut").innerHTML="";return}
    const r1=Math.abs(t1-E)/risk,r2=Math.abs(t2-E)/risk,ok=r2>=1.5;
    const need=r=>Math.round(100/(1+r));
    $("rOut").innerHTML=`<div><span>الهدف 1</span><b>1:${r1.toFixed(2)}</b></div><div><span>الهدف 2</span><b>1:${r2.toFixed(2)}</b></div>
     <div><span>أقل نسبة نجاح تحتاجها حتى تربح (على الهدف 2)</span><b>${need(r2)}%</b></div>
     <div style="border-color:${ok?"var(--buy)":"var(--sell)"}"><span>${ok?"✅ الصفقة تستاهل":"⚠️ الربح قليل مقابل المخاطرة، دوّر دخول أفضل"}</span></div>`}
  ["fH","fL","fD"].forEach(i=>$(i).addEventListener("input",fibCalc));
  ["lS","lB","lR","lE","lSL"].forEach(i=>$(i).addEventListener("input",lotCalc));
  ["rE","rS","r1","r2"].forEach(i=>$(i).addEventListener("input",rrCalc));
  fibCalc();lotCalc();rrCalc();
}

function quizHTML(qz){
  if(!qz.length)return"";
  return`<section class="quiz" id="quiz"><h3>🧠 اختبر نفسك</h3>${qz.map((q,i)=>`<div class="qq" data-q="${i}"><p>${i+1}. ${esc(q.q)}</p>${q.o.map((o,j)=>`<button type="button" class="opt" data-o="${j}">${esc(o)}</button>`).join("")}<div class="why" hidden></div></div>`).join("")}<div class="score" id="qScore" hidden></div></section>`;
}
function bindQuiz(l,qz){
  const box=$("quiz");if(!box)return;let ans=0,ok=0;
  box.addEventListener("click",async e=>{const b=e.target.closest(".opt");if(!b)return;const qq=b.closest(".qq");if(qq.dataset.done)return;
    qq.dataset.done=1;const q=qz[+qq.dataset.q],pick=+b.dataset.o;ans++;
    qq.querySelectorAll(".opt").forEach(x=>{const j=+x.dataset.o;if(j===q.a)x.classList.add("ok");else if(j===pick)x.classList.add("bad")});
    if(pick===q.a)ok++;const w=qq.querySelector(".why");w.hidden=false;w.textContent=(pick===q.a?"✓ صح. ":"✗ مو هيچ. ")+q.why;
    if(ans===qz.length){const s=$("qScore");s.hidden=false;const pct=Math.round(ok/qz.length*100);
      s.innerHTML=`نتيجتك: <b class="num">${ok}/${qz.length}</b> ${pct===100?"🔥 ممتاز!":pct>=66?"👏 زين، راجع اللي غلطت بيه":"📖 راجع الدرس مرة ثانية"}`;
      try{await API.saveProgress(l.id,pct);S.progress[l.id]=pct}catch(e){}}
  });
}

function openBuy(kind,cid){

  const price=kind==="course"?c.price:kind==="zoom"?S.info.price_zoom:S.info.price_monthly;
  const tg=`https://t.me/${tgUser()}?text=${encodeURIComponent(`مرحبا كوتش، أريد أدفع: ${label} (${money(price)}). إيميلي: ${S.user.email||""}`)}`;
  $("dlgBody").innerHTML=`<h2>${kind==="zoom"?"احجز جلستك الخاصة":"إتمام الطلب"}</h2>

      <button class="btn gold" type="submit">${kind==="zoom"?"أرسل طلب الحجز":"أرسل الطلب"}</button>

async function squareJpeg(file,max){const url=URL.createObjectURL(file),img=new Image();await new Promise((ok,bad)=>{img.onload=ok;img.onerror=()=>bad(new Error("الملف مو صورة"));img.src=url});
  const s=Math.min(img.width,img.height),o=Math.min(max,s),c=document.createElement("canvas");c.width=c.height=o;
  c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,o,o);return await new Promise(r=>c.toBlob(r,"image/jpeg",.9))}

/* ================= events & routing ================= */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-buy]");if(b){e.preventDefault();openBuy(b.dataset.buy,b.dataset.course);return}
  if(e.target.closest("[data-close]")){$("dlg").close();return}
  const r=e.target.closest("[data-rsvp]");if(r){const id=+r.dataset.rsvp,on=!S.rsvp.has(id);r.disabled=true;try{await API.rsvp(id,on);on?S.rsvp.add(id):S.rsvp.delete(id);r.textContent=on?"✓ راح أذكّرك":"🔔 ذكّرني";toast(on?"✅ راح يوصلك تذكير قبل يوم وقبل ساعة":"تم إلغاء التذكير")}catch(err){toast(err.message)}r.disabled=false;return}
  const j=e.target.closest("[data-join]");if(j){j.disabled=true;try{const u=await API.link(+j.dataset.join);if(u)window.open(u,"_blank","noopener");else toast("الرابط مو متوفر إلك")}catch(err){toast(err.message)}j.disabled=false;return}
  const t=e.target.closest("[data-at]");if(t){ADM.tab=t.dataset.at;adminTab();return}
  const pay=e.target.closest("[data-pay]");if(pay){const id=+pay.dataset.pay,r=ADM.rows.find(x=>x.id===id),f={status:"paid"};
    if(r.kind==="zoom"){const at=$("at-"+id).value,zu=$("zu-"+id).value.trim();if(!at){$("at-"+id).focus();toast("حدد موعد الجلسة");return}f.session_at=new Date(at).toISOString();f.zoom_url=zu}
    pay.disabled=true;try{await API.aSetPurchase(id,f);toast("✅ تفعّل ووصل العميل إيميل");adminPage()}catch(err){toast(err.message);pay.disabled=false}return}
  const rej=e.target.closest("[data-rej]");if(rej){const id=+rej.dataset.rej;try{await API.aSetPurchase(id,{status:"rejected",admin_note:$("rn-"+id).value.trim()});adminPage()}catch(err){toast(err.message)}return}
  const dn=e.target.closest("[data-done]");if(dn){try{await API.aSetPurchase(+dn.dataset.done,{status:"done"});adminPage()}catch(err){toast(err.message)}return}
  const ds=e.target.closest("[data-dels]");if(ds){if(!confirm("تحذف هذا الدرس؟"))return;try{await API.aDelSession(+ds.dataset.dels);ADM.sess=await API.aSessions();S.sessions=await API.sessions();adminLive()}catch(err){toast(err.message)}return}
});
